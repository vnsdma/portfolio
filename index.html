<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFBF9" />
    <title>Naufal Faris Fadhil | Fullstack Software Engineer</title>
    <meta name="description" content="Portfolio of Naufal Faris Fadhil (@vnsdma) - Fullstack Software Engineer specializing in high-performance web systems, multi-gateway payments, and point-of-sale operations." />

    <!-- Theme: light is the default. Runs before first paint so there is no flash. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (e) {}
        var root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a1420' : '#FBFBF9');
      })();
    </script>

    <!--
      Light:  Bricolage Grotesque (display) + Space Grotesk (body)
      Dark:   Hanken Grotesk (display) + JetBrains Mono (body)
      Shared: Instrument Serif italic for headline accents
      Browsers only download the files the active theme actually uses.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400..800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
